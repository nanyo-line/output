<h2>ルール</h2>
<textarea name="clarification_rules" id="clarification_rules" rows="55" placeholder="ルールを入力してください">
### ルール
1. 必須条件:
 - 完成プロンプトは、ユーザーがコピペしてそのまま実行できる完全な形で出力すること。
 - 単なる文章作成指示ではなく、目的・前提・制約・出力形式・完了条件を含めること。
2. 許可条件:
 - 入力情報の軽微な不足に対しては、合理的な仮定を「前提条件」に明示して補完してよい。
 - 用途に応じて、TEXT、YAML、JSON（またはJSON Schema）の最適な形式を単独または組み合わせて提示してよい。
3. 禁止条件:
 - AI内部の生の思考過程、逐語的推論、自己採点プロセスをそのまま出力に漏らしてはならない。
 - 特定のフォーマット（JSONやYAML）を使用すること自体を「魔法の精度向上策」として過大評価・説明してはならない。
 - 事実や権限、外部接続操作を推測で勝手に作ってはならない。

### 作業ステップ又は思考ステップ
1. フェーズ1：入力解析とコンテキスト定義
 - ユーザー入力から「目的」「対象読者・利用者」「情報の流れる場所」を抽出・定義する。
2. フェーズ2：3階建て階層の選定
 - TEXT: 対話型・クリエイティブ・直感的な指示が必要な場合。
 - YAML: 人間が可読・編集・管理しやすい設計・指示書の場合。
 - JSON / JSON Schema: システム連携・プログラム出力・構造化データ定義の場合。
3. フェーズ3：処理仕様の設計（ハーネス構築）
 - 必須（成立条件）、許可（裁量範囲）、禁止（境界）、手順（実行順）、停止（異常系制御）を定義する。
4. フェーズ4：完成プロンプトの組み立て
 - 定められた指定カテゴリ（前提条件、実行指示、ガードレール等）に沿ってテキストを構造化する。
5. フェーズ5：検証と出力
 - 指示同士の矛盾、変数の未定義、過学習リスクを検証し、修正済みの完成プロンプトのみを出力する。

### ガードレール
- 思考実況の禁止: AIの生の思考ログや推論プロセスを成果物の中に開示・表示させない。
- 虚偽動作の禁止: 実行していない外部ツール参照やデータ取得を「実行した」と見せかけない。
- 無断変更の禁止: ユーザーが意図した目的や背景を、勝手な推測で書き換えない。

### 補足
- プロンプトの3階建て概念について:
 - 1階（TEXT）: AIと人間が直接対話するインターフェース。柔軟な発想や自然な文脈伝達に向く。
 - 2階（YAML）: 人間が設計・編集するワークスペース。属性や制約を階層的に視覚化・整理するのに最適。
 - 3階（JSON / JSON Schema）: システムやプログラムと連携するインターフェース。厳密なデータ型や構造保証に向く。
 - 設計の思想: プロンプトの成果は「形式」ではなく「どのようなコンテキストと処理仕様を渡したか」によって決まる。

### 例外処理
- 入力情報が不十分な場合: 目的が大きくブレる恐れがある重要項目（対象・権限等）が不足している場合、完成プロンプトを出力する前に、必要最小限の質問文を出力して一時停止する。
- 矛盾する指示がある場合: 指示間の競合（例：「超短文で」と「詳細な解説」の両立等）を検出した場合、優先順位を「安全・制約 ＞ 目的適合 ＞ 形式」の順で整理し修正する。

### ネガティブ制約条件
- AI内部の生の推論プロセスの逐語的出力を禁止する。
- 「JSONだから正確」「YAMLだから強い」といった根拠のないメタ表現を含めない。
- ユーザーに提示する成果物において、作業ログや思考芝居を最終回答より優先させてはならない。

### 失敗条件設計
- 起こりやすい失敗: 形式（JSON/YAML等）の変換のみを行い、タスクの目的・背景・制約といった本質的情報（処理仕様）が抜け落ちること。
- 失敗の兆候: 出力されたプロンプトが、どのフォーマットでも汎用的・抽象的な内容（「適切に処理してください」等）にとどまっている。
- 誤りと判定する条件: 完了条件や異常時の停止条件（エスカレーション・確認条件）が定義されていない場合。
- 確認方法: 生成したプロンプトに対し、「入力が不正な場合にAIが勝手に推測で埋めないか」「出力の良し悪しを判定する基準があるか」を照合する。
- 判断に迷った場合の優先順位:
  1. 安全性・法令・環境制約
  2. ユーザーの目的と成果物の適合性
  3. 検証可能性と完了条件の明確さ
  4. 形式（TEXT/YAML/JSON）の美しさ
- 失敗検出後の対応: 失敗条件に該当した場合は処理を一時停止し、不足している制約や条件を再補完した上で再構築を行う。

    communicationContent += "<リソース>\n" + (formData.get('resource') || '特に指示無し\n') + "</リソース>\n\n";
    communicationContent += "<実行指示>\n" + (formData.get('instructions') || '特に指示無し\n') + "</実行指示>\n\n";
    communicationContent += "<ルール>\n" + (formData.get('clarification_rules') || '特に指示無し\n') + "</ルール>\n\n";
    communicationContent += "<出力形式>\n" + (formData.get('output') || '特に指示無し\n') + "</出力形式>\n\n";
    communicationContent += "<ユーザー入力>" + (formData.get('hensu') || '') + "\n";
    communicationContent += "##プロンプト概要=" + (formData.get('hensu1') || '特に指示無し') + "\n";
    communicationContent += "##タスク=" + (formData.get('hensu2') || '特に指示無し') + "\n</ユーザー入力>\n\n";
    communicationContent += "<補足>\n" + (formData.get('hosoku') || '特に指示無し\n') + "</補足>\n";

    // クリップボードにコピー
    navigator.clipboard.writeText(communicationContent).then(() => {
        alert('プロンプトがコピーされました。');
    }).catch(err => {
        console.error('クリップボードへのコピーに失敗しました:', err);
        alert('プロンプトのコピーに失敗しました。');
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const toggleIcon = document.getElementById('toggleIcon');
    const togglableSections = document.querySelectorAll('.togglable-section');

    // Default: All blocks should be displayed
    // Set initial state of toggleIcon to 'hide' (×) and its title
    if (toggleIcon) { // Ensure toggleIcon exists before setting its properties
        toggleIcon.innerHTML = '×'; // Initially show 'hide' icon
        toggleIcon.title = ''; // Initially no tooltip when visible
    }

    if (toggleIcon && togglableSections.length > 0) {
        toggleIcon.addEventListener('click', function() {
            const isHidden = togglableSections[0].style.display === 'none'; // Check current display state
            if (isHidden) { // If currently hidden, show them
                togglableSections.forEach(section => {
                    section.style.display = 'block';
                });
                toggleIcon.innerHTML = '×'; // Change icon to 'hide'
                toggleIcon.title = 'プロンプト非表示'; // No tooltip when visible
            } else { // If currently visible, hide them
                togglableSections.forEach(section => {
                    section.style.display = 'none';
                });
                toggleIcon.innerHTML = '☰'; // Change icon to 'show'
                toggleIcon.title = 'プロンプト表示'; // Set title for 'show' state
            }
        });
    }
});
</script>
