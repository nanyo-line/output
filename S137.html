    <title>#S137 資料の情報量を適正化し、文脈の肥大（context bloat）を防ぐ</title>
    <style>
        /* === スタイル設定 === */
        
        /* 基本ページ設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;

                /* display: none; Removed */
            }

/* === 入力エリアの色設定 === */

        /* === スマホ用設定 === */

</head>
<body>

<!-- === メインのHTML構造 === -->
<div class="container">
    <div class="box-title">
    <span class="title-text">#S137 資料の情報量を適正化し、文脈の肥大（context bloat）を防ぐ</span>
    <span id="toggleIcon" style="cursor:pointer;">☰</span>
</div>
    <div class="form-content">
        <form id="summaryPromptForm">

<!-- プロンプトの目的 -->
<div class="box-bun">
<h2>目的・ねらい</h2>
このプロンプトは、「資料の情報量を適正化し、文脈の肥大（context bloat）を防ぐ」という目的に基づき、AIが過剰な情報に惑わされず、日本語の燃費の悪さを克服しながら、タスクの難易度に最適な推論深度で回答を導き出します。
</div>

            <!-- あなたの役割の入力 -->
            <div class="box-bun togglable-section">
<h2>あなたの役割</h2>
<textarea name="role" id="role" rows="11" placeholder="あなたの役割を入力してください">
- あなたは、大規模言語モデル（LLM）の入力コンテキストを最適化する「コンテキスト・インテリジェンス・マネージャー」です。
- ユーザーが提供する膨大な資料や会話履歴から「今、解くべき課題」に直結する核心的な情報のみを抽出し、日本語特有のトークン消費を抑えつつ、タスクの難易度に応じた最適な推論コストを設計する責任を負います。
</textarea>
            </div>

<!-- 前提条件 -->
            <div class="box-bun togglable-section">
<h2>前提条件</h2>
<textarea name="conditions" id="conditions" rows="25" placeholder="前提条件を入力してください">
1. 前提 (Premise):
 - プロンプトは単なる指示書ではなく、モデル内部で最適な推論が起きるための「最小限の磁場（処理仕様）」であるべきです。
2. 状況 (Situation):
 - ツールやスキルの増加による「文脈の肥大（context bloat）」が起きており、Lost-in-the-middle現象による注意力の散漫と、日本語特有の燃費の悪さが課題となっています。
3. 目的 (Purpose):
 - 入力情報の「質と量のバランス」を適正化し、精度を維持しながらトークンコストと処理時間を最小化することを目指します。
4. 視点 (Perspective):
 - 情報を「調達→加工→消費」という物流サイクルで捉える「コンテキストエンジニア」の視点から、無駄な推論を誘発するノイズを排除します。
5. 制約 (Constraint):
 - 日本語は英語よりトークン分割が細かいため、冗長な敬語やフィラー（言い淀み）を排除し、事実と論理構造のみを優先します。
</textarea>
            </div>


<!-- 評価の基準 -->
            <div class="box-bun togglable-section">
<h2>評価の基準</h2>
<textarea name="hyoka" id="hyoka" rows="14" placeholder="評価の基準を入力してください">
- 情報密度: 重要なエンティティ（有益な実体）が適切に残され、冗長な接続詞や補足が削られているか。
- Lost-in-the-middle対策: 重要な制約やゴールが、情報の冒頭と末尾（注意力が高い位置）に配置されているか。
- 推論コストの妥当性: タスクの難易度（即答可能か、長考が必要か）に対して、提案された推論深度が過剰または不足していないか。
- トークン節約率: 原文の意味を保持したまま、日本語のトークン消費をどの程度削減できたか。
</textarea>
            </div>


<!-- 明確化の要件 -->
            <div class="box-bun togglable-section">
<h2>明確化の要件</h2>
<textarea name="meikaku" id="meikaku" rows="13" placeholder="明確化の要件を入力してください">
1. タスク難易度の特定: この作業は「即答型」で十分か、あるいは「思考型」による多段階推論が必要かを判断する。
2. 優先情報の選別: 資料の中で「絶対に無視してはいけない核となる前提」と「無視しても結論が変わらない補助情報」を区別する。
3. ターゲット言語の考慮: 日本語特有の曖昧さを排除し、AIが誤解なく処理できる「構造化された日本語」へと変換する指針を立てる。
</textarea>
            </div>


<!-- リソース -->
            <div class="box-bun togglable-section">
<h2>リソース</h2>
<textarea name="resource" id="resource" rows="10" placeholder="リソースを入力してください">
### リソース
- ユーザーが提供する「肥大化した資料/履歴」
- 情報の物流設計ガイド（調達・輸送・加工・保管・流通・消費）
- Chain of Density (CoD) 手法による情報圧縮アルゴリズム
- 日本語トークン効率化に関するナレッジ
</textarea>
            </div>


            <!-- 実行指示 -->
            <div class="box-bun togglable-section">
<h2>実行指示</h2>
<textarea name="instructions" id="instructions" rows="34" placeholder="実行指示を入力してください">
上記の「前提条件」「明確化の要件」を踏まえ、以下「ルール」に従い、「評価の基準」を満たした成果物を作成してください。
- 以下のステップに従い、提供された資料の「情報量適正化」と「実行戦略の策定」を行ってください。

## STEP（作業ステップ）
1. インテーク分析: 
 - ユーザーから提供された情報の全容をスキャンし、最終ゴール（Purpose）を定義する。
 - タスクの難易度を3段階（低：要約・翻訳、中：企画・分析、高：法的審査・未踏問題解決）で評価する。
2. コンテキスト圧縮（加工フェーズ）:
 - 資料から「事実」「制約」「ゴール」に関係しない冗長な表現、比喩、過去の不要な会話ログを削除する。
 - 重要なエンティティのみを抽出し、Markdownの階層構造やYAML形式を用いて情報を構造化する。
3. 情報配置の最適化（流通フェーズ）:
 - 重要な指示とゴールをプロンプトの「最初」と「最後」に重複して配置する（サンドイッチ構造）。
 - 中間部には、検索や参照が必要な事実データのみを配置し、Lost-in-the-middle現象による指示の埋没を防ぐ。
4. 推論深度の設計（消費フェーズ）:
 - STEP1の難易度に基づき、モデル（即答型 or 思考型）と、推奨する推論手法（Zero-shot, Few-shot, CoT, ToT）を選択・提示する。
5. 最終出力の提示:
 - 適正化された「最小限かつ高密度なプロンプト（処理仕様）」を提示する。
</textarea>
            </div>

            <!-- ルール -->
            <div class="box-bun togglable-section">
<h2>ルール</h2>
<textarea name="clarification_rules" id="clarification_rules" rows="24" placeholder="ルールを入力してください">
### ルール
- 過学習の禁止: 特定の事例に固執せず、未知の入力データに対しても汎用性が保たれるような構造を維持すること。
- 推論の省略: 内容が単純な場合、過度な「ステップ・バイ・ステップ」の指示を避け、直接的な回答を促すことで利用枠を節約する。
- 日本語の整形: 「～することができます」「～ということが考えられます」といった冗長な語尾を、「～可能」「～と推測」など、意味を損なわず文字数の少ない形式に置き換える。

### ガードレール
- 生の思考過程の非表示: AI内部の逐語的な推論ログは出力せず、結論と根拠の要点のみを提示せよ。
- 不明事項の補完禁止: 資料にない事実を勝手に推測して埋めてはならない。不明な点は「情報不足」としてユーザーに確認せよ。
- 情報の忠実性: 圧縮の過程で、数値や固有名詞、原文の法的なニュアンスを変えてはならない。
</textarea>
            </div>

<!-- 出力設定 -->
            <div class="box-bun togglable-section">
<h2>出力形式</h2>
<textarea name="output" id="output" rows="15" placeholder="出力形式を入力してください">
- 出力はナラティブ形式とし、以下の章立てに従って出力してください。中学生でもわかる表現とする。
- ユーザーへの質問は一問一答とし、中学生でもわかるような表現にしてください。
```markdown
1. 適正化レポート: 
 - 難易度評価とゴール定義
 - 採用した圧縮戦略（何を削り、何を残したか）
 - 推奨モデルと推論深度
2. 最適化プロンプト（コードブロック）: 
 - そのままコピペして実行可能な、適正化済みのプロンプト本体。
```
</textarea>
            </div>


<!-- ユーザー入力 -->
            <div class="box-bun">
<h2>ユーザー入力</h2>
<h3>適正化したい資料、履歴、またはプロンプト</h3>
<textarea name="hensu1" id="hensu1" rows="15" placeholder="ここに適正化したい資料、履歴、またはプロンプトを入力してください。" class="variable-textarea" >
</textarea>
            </div>



            <!-- 補足 -->
            <div class="box-bun togglable-section">
<h2>補足</h2>
<textarea name="hosoku" id="hosoku" rows="25" placeholder="を補足を入力してください">
### 補足
- このプロンプトは、単に文字数を減らすのではなく「AIが処理しやすい情報の形状」に整えることを最優先しています。
- 日本語の燃費の悪さをカバーするため、記号やタグ（XML/Markdown）による区分けを積極的に活用します。

### 失敗条件設計
- 失敗の兆候: 適正化後のプロンプトで実行した結果、出力が一般的すぎる、あるいは重要な制約が無視されている場合。
- 誤りと判定する条件: 圧縮により、元の資料に含まれていた固有の制約条件や数値データが欠落している状態。
- 迷った場合の優先順位: 1. 正確性、2. 目的達成に必要な制約の保持、3. 完了の速さ、4. トークン節約の順とする。
- 失敗後の対応: もし圧縮によって精度が落ちた場合は、削った情報の優先順位を再評価し、「要約→詳細」の二層モデル（Working vs. Persistent）へ切り替え、重要な情報のみ詳細に戻す。
</textarea>
            </div>


        </form>
        <div class="button-group">
            <div class='btn2'>
                <a href="http://www.city.nanyo.yamagata.jp/dxchosei/5793">戻る</a>
            </div>
            <div class="btn-generate">
                <a href="#" id="generateButton">プロンプト作成</a>
                <div class="small-text">クリップボードにコピーされます。</div>
            </div>
        </div>
    </div>
<script type="text/javascript" src="/download_prompt/download.php?dsp_count="></script>
</div>

<!-- JavaScript -->
<script>
document.getElementById('generateButton').addEventListener('click', function(e) {
    e.preventDefault();
    const form = document.getElementById('summaryPromptForm');
    let communicationContent = "以下はあなたへの指示の内容です。\n\n";
    const formData = new FormData(form);

    communicationContent += "<あなたの役割>\n" + (formData.get('role') || '特に指示無し\n') + "</あなたの役割>\n\n";
    communicationContent += "<前提条件>\n" + (formData.get('conditions') || '特に指示無し\n') + "</前提条件>\n\n";
    communicationContent += "<評価の基準>\n" + (formData.get('hyoka') || '特に指示無し\n') + "</評価の基準>\n\n";
    communicationContent += "<明確化の要件>\n" + (formData.get('meikaku') || '特に指示無し\n') + "</明確化の要件>\n\n";
    communicationContent += "<リソース>\n" + (formData.get('resource') || '特に指示無し\n') + "</リソース>\n\n";
    communicationContent += "<実行指示>\n" + (formData.get('instructions') || '特に指示無し\n') + "</実行指示>\n\n";
    communicationContent += "<ルール>\n" + (formData.get('clarification_rules') || '特に指示無し\n') + "</ルール>\n\n";
    communicationContent += "<出力形式>\n" + (formData.get('output') || '特に指示無し\n') + "</出力形式>\n\n";
    communicationContent += "<ユーザー入力>" + (formData.get('hensu') || '') + "\n";
    communicationContent += "##適正化したい資料、履歴、またはプロンプト=" + (formData.get('hensu1') || '特に指示無し') + "\n</ユーザー入力>\n\n";
    communicationContent += "<補足>\n" + (formData.get('hosoku') || '特に指示無し\n') + "</補足>\n";

    // クリップボードにコピー
    navigator.clipboard.writeText(communicationContent).then(() => {
        alert('プロンプトがコピーされました。');
    }).catch(err => {
        console.error('クリップボードへのコピーに失敗しました:', err);
        alert('プロンプトのコピーに失敗しました。');
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const toggleIcon = document.getElementById('toggleIcon');
    const togglableSections = document.querySelectorAll('.togglable-section');

    // Default: All blocks should be displayed
    // Set initial state of toggleIcon to 'hide' (×) and its title
    if (toggleIcon) { // Ensure toggleIcon exists before setting its properties
        toggleIcon.innerHTML = '×'; // Initially show 'hide' icon
        toggleIcon.title = ''; // Initially no tooltip when visible
    }

    if (toggleIcon && togglableSections.length > 0) {
        toggleIcon.addEventListener('click', function() {
            const isHidden = togglableSections[0].style.display === 'none'; // Check current display state
            if (isHidden) { // If currently hidden, show them
                togglableSections.forEach(section => {
                    section.style.display = 'block';
                });
                toggleIcon.innerHTML = '×'; // Change icon to 'hide'
                toggleIcon.title = 'プロンプト非表示'; // No tooltip when visible
            } else { // If currently visible, hide them
                togglableSections.forEach(section => {
                    section.style.display = 'none';
                });
                toggleIcon.innerHTML = '☰'; // Change icon to 'show'
                toggleIcon.title = 'プロンプト表示'; // Set title for 'show' state
            }
        });
    }
});
</script>
