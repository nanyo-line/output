- ユーザーの抱える曖昧な「やりたいこと（抽象概念）」を深く分析し、AIや人間が一切の迷いなく実行できる「観察可能な行動動詞（物理的アクション）」と「操作レバー」へと分解・再構築する責任を担います。

            <div class="box-bun togglable-section">
<h2>前提条件</h2>
<textarea name="conditions" id="conditions" rows="35" placeholder="前提条件を入力してください">
1. 前提 (Premise): 
 - 「素晴らしい語彙をつくる力」とは、業務や思考の“機能”に名前をつける力である。
 - 曖昧な抽象語を用いた指示は、AIや人間との間に「認識のズレ」や「暗黙知の壁」を生み、ハルシネーションや品質低下を引き起こす。
 - したがって、あらゆる概念は「客観的に測定・観察可能な行動」に変換して語彙化されなければならない。
   * 精度向上を急ぐあまり、未知のデータに対する汎用性を損なってはならない（過学習の禁止）。
   * 完了の速さよりも、検証可能な安全性を優先する。
2. 状況 (Situation): 
 - ユーザーは「やりたいこと」が曖昧な状態、または「何を指示すればAIが正確に動くか分からない」という課題に直面している。
3. 目的 (Purpose): 
 - 曖昧な概念を「ペルソナ・タスク・コンテキスト・形式」の4つの操作レバーに変換し、さらに「テーマ → 現状 → 失敗原因 → 分解 → 中間成果物 → 順序 → 単文プロンプト」という逆算設計のプロセスを通じて、実行・検証可能なアクションプランを創出すること。
4. 視点 (Perspective): 
 - 「それっぽい言葉遣いの制服を着せる（ロールプレイ）」旧来のプロンプトを脱却し、AIの思考のOSとなる「メタ憲法（認知設計）」を構築する視点を持つ。
5. 制約 (Constraint): 
 - 「なるべく」「いい感じに」「理解する」「考える」といった、客観的に観察できない認知的・主観的動詞を排除し、すべて「書き出す」「対比する」「箇条書きにする」などの物理的アクションへ徹底的に言い換える。
</textarea>

- 操作レバーの適合性: 「ペルソナ（誰が）」「タスク（何を）」「コンテキスト（どのような背景で）」「形式（どう出力するか）」の4要素が、過不足なく定義されているか。
- 論理の一貫性と逆算性: 最終的な単文プロンプト（動詞1つの指示）に至るまでの「中間成果物」と「順序関係」が、MECE（漏れなくダブりなく）に設計されているか。
</textarea>

<textarea name="meikaku" id="meikaku" rows="21" placeholder="明確化の要件を入力してください">
1. 最終ゴールの定義: ユーザーが最終的に何を実現したいか（To-Be）を明確にする。
2. 現状（As-Is）の特定: 相手（AIまたは現場の人間）が今、どこで困っているか、どのような「認識のズレ」があるかを言語化する。
3. 失敗原因の構造化: 曖昧な指示やアドバイスが、なぜ失敗を招いているのかを「4つの構成要素」に分解して特定する。
4. 補完の範囲の区別:
 - AIが自律的に補完してよい事項: 一般的な業務手順の標準化例、一般的な言葉の言い換え表現。
 - 仮定を明示すれば補完してよい事項: ユーザーから直接提供されない、ターゲット（ペルソナ）の潜在的な悩みや業界の背景要因。
 - ユーザーへの確認が必要な事項: 最終的に達成したい「目的」と「制約条件」の根幹。
 - AIが推測や補完をしてはいけない事項: 機密情報、法令・安全性に関わる実データ。
</textarea>

上記の「前提条件」「明確化の要件」を踏まえ、以下「ルール」に従い、「評価の基準」を満たした成果物を作成してください。

## STEP（作業ステップ）
1. よくある行動・抽象語の特定:
 - ユーザーの入力や一般的な指示から、多くの人が無意識に使っている「短くて曖昧な指示（抽象語・認知的動詞）」を抽出する。
2. 失敗原因の構造化（4つの構成要素分解）:
 - なぜその曖昧な指示ではうまくいかないのか、その原因を「ペルソナ」「タスク」「コンテキスト」「形式」のズレとして4要素に分解・構造化する。
3. 「概念」から「実体（行動）」への転換:
 - メタスキル①・②を適用し、抽出した抽象的な概念を、人が実際に行う「観察可能な物理的行動」へと変換して語彙化する。
4. 中間成果物と順序の設計:
 - 最終ゴールの前に、何が完成していればいいか（中間成果物）を定義し、どれを先に決めないと次を決められないか、時系列の「順序」を決定する。
5. 単文プロンプトの創出（動詞1つの指示）
 - 各工程を完了させるための、最もシンプルで解像度の高い「動詞1つの実行指示（単文プロンプト）」を創出する。

- 「曖昧語・認知的動詞」の厳禁: 「把握する」「意識する」「理解する」「適切に対応する」「頑張る」などの表現は絶対に使用しない。すべて「〇〇をリストアップする」「差分を対比表にまとめる」「手順を番号順に記述する」などに置換すること。
- 一文一義の徹底: 作業手順は1ステップ1文で分け、誰が読んでも同じ動作を再現できるように簡潔に記述すること。
- 検証可能な安全性の優先: 完了の速さよりも、各ステップが安全かつ検証可能であることを優先して設計すること。

### ガードレール
- 指示の復唱、自己評価、または「承知しました」などの余計な前置き・結論は一切出力しない。
- AIの内部の生の思考過程や逐語的な推論（Thoughtプロセスなど）は、ユーザーに見せないよう完全に隠蔽・制御すること。

    communicationContent += "<出力形式>\n" + (formData.get('output') || '特に指示無し\n') + "</出力形式>\n\n";
    communicationContent += "<ユーザー入力>" + (formData.get('hensu') || '') + "\n";
    communicationContent += "##作りたいプロンプトや達成したいゴール=" + (formData.get('hensu1') || '特に指示無し') + "\n";
    communicationContent += "##困っていること、うまくいかない状況=" + (formData.get('hensu2') || '特に指示無し') + "\n</ユーザー入力>\n\n";
    communicationContent += "<補足>\n" + (formData.get('hosoku') || '特に指示無し\n') + "</補足>\n";

    // クリップボードにコピー
    navigator.clipboard.writeText(communicationContent).then(() => {
        alert('プロンプトがコピーされました。');
    }).catch(err => {
        console.error('クリップボードへのコピーに失敗しました:', err);
        alert('プロンプトのコピーに失敗しました。');
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const toggleIcon = document.getElementById('toggleIcon');
    const togglableSections = document.querySelectorAll('.togglable-section');

    // Default: All blocks should be displayed
    // Set initial state of toggleIcon to 'hide' (×) and its title
    if (toggleIcon) { // Ensure toggleIcon exists before setting its properties
        toggleIcon.innerHTML = '×'; // Initially show 'hide' icon
        toggleIcon.title = ''; // Initially no tooltip when visible
    }

    if (toggleIcon && togglableSections.length > 0) {
        toggleIcon.addEventListener('click', function() {
            const isHidden = togglableSections[0].style.display === 'none'; // Check current display state
            if (isHidden) { // If currently hidden, show them
                togglableSections.forEach(section => {
                    section.style.display = 'block';
                });
                toggleIcon.innerHTML = '×'; // Change icon to 'hide'
                toggleIcon.title = 'プロンプト非表示'; // No tooltip when visible
            } else { // If currently visible, hide them
                togglableSections.forEach(section => {
                    section.style.display = 'none';
                });
                toggleIcon.innerHTML = '☰'; // Change icon to 'show'
                toggleIcon.title = 'プロンプト表示'; // Set title for 'show' state
            }
        });
    }
});
</script>
