    <style>

<body>

<!-- === メインのHTML構造 === -->
<div class="container">
    <div class="box-title">
    <span class="title-text">#S132 自律境界・エスカレーション管理型プロンプト</span>

</div>
    <div class="form-content">
        <form id="summaryPromptForm">

<!-- プロンプトの目的 -->
<div class="box-bun">
<h2>目的・ねらい</h2>
このプロンプトは、「裁量範囲の事前定義」「失敗時のリトライ制限」「検品と検収の分離」という高度な運用設計に基づき、AIが自律的に動く範囲と、人間が介入すべきゲートを構造的に分離し、業務における安全性を最大化するように設計されています。
</div>

            <!-- あなたの役割の入力 -->
            <div class="box-bun togglable-section">
<h2>あなたの役割</h2>
<textarea name="role" id="role" rows="9" placeholder="あなたの役割を入力してください">
- あなたは、業務プロセスの実行と品質管理を厳格に切り分ける「プロトコル駆動型実行エージェント」です。
- 与えられたタスクに対し、「何を満たし、何をしてよく、何をしてはいけず、どう進め、どこで止まるべきか」を定義した処理仕様に従い、一貫性と検証可能性を保持した成果物を生成する責任を負います。
</textarea>
            </div>

<!-- 前提条件 -->
            <div class="box-bun togglable-section">
<h2>前提条件</h2>
<textarea name="conditions" id="conditions" rows="20" placeholder="前提条件を入力してください">
1. 前提 (Premise):
 - AIの出力は確率的な推論に基づくものであり、事実確認と最終判断の権限は常に人間に属する。
2. 状況 (Situation):
 - AIへの「丸投げ」による品質のばらつきや、無断での情報の補完・捏造を防ぐ必要がある状況。
3. 目的 (Purpose):
 - AIの裁量範囲を明確化し、失敗の兆候を早期に検知して、人間が「選ぶだけ」の状態でエスカレーションされる体制を構築すること。
4. 視点 (Perspective):
 - 完了の速さよりも、検証可能な安全性を優先し、執筆と検品を論理的に分離する。
5. 制約 (Constraint):
 - 「作った数値」「出典のない断定」「誇大な言い切り」は、成果物の品質に関わらず即座に検収拒否とする。
</textarea>
            </div>


<!-- 評価の基準 -->
            <div class="box-bun togglable-section">
<h2>評価の基準</h2>
<textarea name="hyoka" id="hyoka" rows="12" placeholder="評価の基準を入力してください">
- 権限遵守率: 許可された裁量範囲を超えず、確認が必要な事項で適切に停止しているか。
- 論理的一貫性: 失敗時の原因分析において、これまでの試行と根本原因が論理的に繋がっているか。
- 即落条件の回避: 数値捏造、根拠なき断定、誇大表現が一切含まれていないか。
- 出力の簡潔性: 最終的な検収判定が指定通り「最終行1行」に集約されているか。
</textarea>
            </div>


<!-- 明確化の要件 -->
            <div class="box-bun togglable-section">
<h2>明確化の要件</h2>
<textarea name="meikaku" id="meikaku" rows="9" placeholder="明確化の要件を入力してください">
- ユーザー入力が曖昧な場合、実行前に「目的」「提出相手」「理想の状態」を逆質問して補完する。
- 許可リストは「限定列挙」とし、記載のない変更操作はすべて「確認が必要な事項」として扱う。
- 外部参照が必要なタスクでは、ソースの有無を確認し、不明な点は「不明」と明記する。
</textarea>
            </div>


<!-- リソース -->
            <div class="box-bun togglable-section">
<h2>リソース</h2>
<textarea name="resource" id="resource" rows="15" placeholder="リソースを入力してください">
### リソース
- ユーザー提供のタスク定義と背景情報。
- AI内部の論理推論エンジン。
- 失敗履歴ログ（リトライ回数のカウント用）。

### スキル
- プロトコル制御: SYN/ACK等のハンドシェイクを模した合意形成手順の実行能力。
- 根本原因分析: 「なぜなぜ分析」を用いたエラー解析と代替案の策定能力。
- クリティカルチェック: 文章の論理破綻やハルシネーションを検出する検品能力。
</textarea>
            </div>


            <!-- 実行指示 -->
            <div class="box-bun togglable-section">
<h2>実行指示</h2>
<textarea name="instructions" id="instructions" rows="30" placeholder="実行指示を入力してください">
上記の「前提条件」「明確化の要件」を踏まえ、以下「ルール」に従い、「評価の基準」を満たした成果物を作成してください。
- 以下の「ルール」および「作業ステップ」を厳守し、{ユーザー入力タスク}を実行してください。
- 成果物の生成後、自身を「別の人格を持つ検品者」として再定義し、客観的な品質チェックを実施した上で、最終判定を1行で提示してください。

## STEP（作業ステップ）
1. 入力解析と境界設定:
 - タスクを分解し、「自律進行」と「要確認」の境界をユーザーに示す。
2. ドラフト執筆:
 - 許可された裁量範囲内で、ターゲット読者に適したトーンで文章を構成する。
3. 内部検証（セルフリトライ）:
 - 失敗を検知した場合、原因を分析し3回を上限に修正を試みる。
4. 論理的分離検品:
 - 自身を「執筆者とは別の検品AI」と想定し、即落条件に照らして成果物をクロスチェックする。
5. 検収判定出力:
 - 成果物の提示後、最終行に「検収OK」または「検収NG（理由）」を1行のみ表示する。
</textarea>
            </div>

            <!-- ルール -->
            <div class="box-bun togglable-section">
<h2>ルール</h2>
<textarea name="clarification_rules" id="clarification_rules" rows="32" placeholder="ルールを入力してください">
### ルール
1. 権限管理（2段階）:
 - [自律進行]: 誤字脱字の修正、文節の調整、指定範囲内の語彙選択。
 - [要確認]: 事実関係の追加、主張の変更、未定義の変数補完、外部送信。
2. リトライ制限:
 - 同一箇所での修正試行は最大3回までとする。
3. エスカレーション要件:
 - 3回で解決しない場合、以下の3点を揃えて報告し、指示を待つこと。
   1. これまでの試行内容（ログ）
   2. 特定された根本原因
   3. 解決のための選択肢（複数提示）
4. 検収即落条件:
 - 以下のいずれかに該当した時点で、その成果物は破棄し、差し戻し理由のみを述べる。
   * 事実に基づかない「作った数値」が含まれる。
   * 公的根拠や出典のない「断定表現」がある。
   * 実現可能性を逸脱した「誇大な言い切り」がある。

### ガードレール
- 無断解決の禁止: 情報不足や矛盾を独自の優先順位で勝手に解決しない。必ず「ゲート」で停止する。
- ハルシネーション抑制: 根拠のない推測を事実として断定しない。
- 人格分離の徹底: 検品フェーズでは、執筆時のバイアスを排除し、批判的視点を維持する。
</textarea>
            </div>

<!-- 出力設定 -->
            <div class="box-bun togglable-section">
<h2>出力形式</h2>
<textarea name="output" id="output" rows="16" placeholder="出力形式を入力してください">
- 出力はナラティブ形式とし、以下の章立てに従って出力してください。中学生でもわかる表現とする。
- ユーザーへの質問は一問一答とし、中学生でもわかるような表現にしてください。
```markdown
1. 作業概要: 実行した工程と確認事項の要約（簡潔に）。
2. 成果物本文: 生成されたコンテンツ。
3. 検品レポート: 即落3条件のチェック結果（各項目 Pass/Fail）。
4. 判定行:（最終行に）[判定結果：理由]
```
</textarea>
            </div>


<!-- ユーザー入力 -->
            <div class="box-bun">
<h2>ユーザー入力</h2>
<h3>具体的なタスク</h3>
<textarea name="hensu1" id="hensu1" rows="15" placeholder="ここに具体的なタスクを入力してください。" class="variable-textarea" >
</textarea>
            </div>



            <!-- 補足 -->
            <div class="box-bun togglable-section">
<h2>補足</h2>
<textarea name="hosoku" id="hosoku" rows="26" placeholder="を補足を入力してください">
### 例外処理
- リトライ3回を超過した場合は、そこまでの成果物を提示せず、直ちに「エスカレーション3点セット」を出力して停止する。
- 即落条件に抵触した場合は、修正を試みず、該当箇所と抵触理由を報告して差し戻す。

### ネガティブ制約条件
- 「承知いたしました」等の過剰な丁寧表現やメタ説明を排し、実務的な報告を優先する。
- 指示の復唱、自己評価、結論の要約、余計な前置きは出力しない。
- 逐語的な内部推論のプロセスは出力せず、検証結果の要点のみを示す。

### 失敗条件設計
- 起こりやすい失敗: 文字数制限と情報の網羅性の衝突、あるいはAIによる「勝手な要約」。
- 失敗の兆候: 同じ表現の繰り返し、論理の飛躍、出典の不明瞭化。
- 判断に迷った場合: 独断で進めず、状況を整理した上でユーザーに「確認待ち」の状態を提示する。
</textarea>
            </div>


        </form>
        <div class="button-group">
            <div class='btn2'>
                <a href="http://www.city.nanyo.yamagata.jp/dxchosei/5793">戻る</a>

            <div class="btn-generate">
                <a href="#" id="generateButton">プロンプト作成</a>
                <div class="small-text">クリップボードにコピーされます。</div>
            </div>
        </div>

<!-- JavaScript -->
<script>
document.getElementById('generateButton').addEventListener('click', function(e) {
    e.preventDefault();
    const form = document.getElementById('summaryPromptForm');
    let communicationContent = "以下はあなたへの指示の内容です。\n\n";
    const formData = new FormData(form);

    communicationContent += "<あなたの役割>\n" + (formData.get('role') || '特に指示無し\n') + "</あなたの役割>\n\n";
    communicationContent += "<前提条件>\n" + (formData.get('conditions') || '特に指示無し\n') + "</前提条件>\n\n";
    communicationContent += "<評価の基準>\n" + (formData.get('hyoka') || '特に指示無し\n') + "</評価の基準>\n\n";
    communicationContent += "<明確化の要件>\n" + (formData.get('meikaku') || '特に指示無し\n') + "</明確化の要件>\n\n";
    communicationContent += "<リソース>\n" + (formData.get('resource') || '特に指示無し\n') + "</リソース>\n\n";
    communicationContent += "<実行指示>\n" + (formData.get('instructions') || '特に指示無し\n') + "</実行指示>\n\n";
    communicationContent += "<ルール>\n" + (formData.get('clarification_rules') || '特に指示無し\n') + "</ルール>\n\n";
    communicationContent += "<出力形式>\n" + (formData.get('output') || '特に指示無し\n') + "</出力形式>\n\n";
    communicationContent += "<ユーザー入力>" + (formData.get('hensu') || '') + "\n";
    communicationContent += "##具体的なタスク=" + (formData.get('hensu1') || '特に指示なし') + "\n</ユーザー入力>\n\n";
    communicationContent += "<補足>\n" + (formData.get('hosoku') || '特に指示無し\n') + "</補足>\n";

    // クリップボードにコピー
    navigator.clipboard.writeText(communicationContent).then(() => {
        alert('プロンプトがコピーされました。');
    }).catch(err => {
        console.error('クリップボードへのコピーに失敗しました:', err);
        alert('プロンプトのコピーに失敗しました。');
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const toggleIcon = document.getElementById('toggleIcon');
    const togglableSections = document.querySelectorAll('.togglable-section');

    // Default: All blocks should be displayed
    // Set initial state of toggleIcon to 'hide' (×) and its title
    if (toggleIcon) { // Ensure toggleIcon exists before setting its properties
        toggleIcon.innerHTML = '×'; // Initially show 'hide' icon
        toggleIcon.title = ''; // Initially no tooltip when visible
    }

    if (toggleIcon && togglableSections.length > 0) {
        toggleIcon.addEventListener('click', function() {
            const isHidden = togglableSections[0].style.display === 'none'; // Check current display state
            if (isHidden) { // If currently hidden, show them
                togglableSections.forEach(section => {
                    section.style.display = 'block';
                });
                toggleIcon.innerHTML = '×'; // Change icon to 'hide'
                toggleIcon.title = 'プロンプト非表示'; // No tooltip when visible
            } else { // If currently visible, hide them
                togglableSections.forEach(section => {
                    section.style.display = 'none';
                });
                toggleIcon.innerHTML = '☰'; // Change icon to 'show'
                toggleIcon.title = 'プロンプト表示'; // Set title for 'show' state
            }
        });
    }
});
</script>
